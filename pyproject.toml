[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cloudagent-local"
version = "0.1.0"
requires-python = ">=3.10"
description = "CloudAgent application and local development entry points"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent*", "app*"]
exclude = ["agent.test*", "agent.conftest"]
namespaces = true

[tool.setuptools.package-data]
"agent.config" = ["mcp_servers.json"]
