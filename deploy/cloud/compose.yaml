name: cloudagent-control
x-logging: &logging
  driver: json-file
  options: {max-size: "10m", max-file: "3"}
services:
  gateway:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    environment:
      PLATFORM_DOMAIN: ${PLATFORM_DOMAIN:?set HTTPS domain}
      ACME_EMAIL: ${ACME_EMAIL:?set certificate contact}
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./site:/srv:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [business]
    logging: *logging
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: cloud_platform
      MYSQL_USER: cloudagent
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set database password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set separate root password}
    volumes: [mysql_data:/var/lib/mysql]
    networks: [data]
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$$MYSQL_PASSWORD" mysql -h 127.0.0.1 -u cloudagent cloud_platform -Nse "SELECT 1" >/dev/null']
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 45s
    logging: *logging
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set cache password}
    command: [sh, -c, 'exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"']
    volumes: [redis_data:/data]
    networks: [data]
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 12
    logging: *logging
  milvus:
    image: milvusdb/milvus:v2.6.17
    restart: unless-stopped
    command: [milvus, run, standalone]
    security_opt: [seccomp:unconfined]
    environment:
      ETCD_USE_EMBED: "true"
      ETCD_DATA_DIR: /var/lib/milvus/etcd
      ETCD_CONFIG_PATH: /milvus/configs/embedEtcd.yaml
      COMMON_STORAGETYPE: local
      DEPLOY_MODE: STANDALONE
    volumes:
      - milvus_data:/var/lib/milvus
      - ./embedEtcd.yaml:/milvus/configs/embedEtcd.yaml:ro
      - ./milvus.yaml:/milvus/configs/user.yaml:ro
    networks: [data]
    healthcheck:
      test: [CMD, curl, -f, http://localhost:9091/healthz]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 90s
    logging: *logging
  neo4j:
    image: neo4j:5.26-community
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?set graph password}
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
    volumes: [neo4j_data:/data]
    networks: [data]
    logging: *logging
  business:
    build: {context: ., dockerfile: Business.Dockerfile}
    restart: unless-stopped
    environment:
      SERVER_ADDRESS: 0.0.0.0
      BUSINESS_PORT: "5000"
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: cloud_platform
      MYSQL_USER: cloudagent
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set database password}
      REDIS_HOST: redis
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/cloud_platform?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set cache password}
      BUSINESS_SERVICE_TOKEN: ${BUSINESS_SERVICE_TOKEN:?set service token}
      AGENT_BASE_URL: http://agent:5001
      PLATFORM_ALLOWED_ORIGINS: https://${PLATFORM_DOMAIN:?set HTTPS domain}
      PLATFORM_SECURE_COOKIE: "true"
      PLATFORM_DEMO: "false"
      PLATFORM_ADMIN_USER: ${PLATFORM_ADMIN_USER:?set administrator}
      PLATFORM_ADMIN_PASSWORD: ${PLATFORM_ADMIN_PASSWORD:?set administrator password}
      APPLICATION_KEY_FILE: /run/secrets/application.key
      P1_DELIVERY_MODE: LOCAL
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=65 -Duser.timezone=UTC
      ALIPAY_SANDBOX_APP_ID: ${ALIPAY_SANDBOX_APP_ID:-}
      ALIPAY_SANDBOX_SELLER_ID: ${ALIPAY_SANDBOX_SELLER_ID:-}
      ALIPAY_PRIVATE_KEY_FILE: /run/secrets/alipay-private.pem
      ALIPAY_PUBLIC_KEY_FILE: /run/secrets/alipay-public.pem
    volumes:
      - ./secrets:/run/secrets:ro
    networks: [default, data]
    depends_on:
      mysql: {condition: service_healthy}
      redis: {condition: service_healthy}
    logging: *logging
  agent:
    build: {context: ., dockerfile: Agent.Dockerfile}
    restart: unless-stopped
    environment:
      BUSINESS_BASE_URL: http://business:5000
      BUSINESS_SERVICE_TOKEN: ${BUSINESS_SERVICE_TOKEN:?set service token}
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: cloud_platform
      MYSQL_USER: cloudagent
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set database password}
      REDIS_URL: redis://:${REDIS_PASSWORD:?set cache password}@redis:6379/1
      MILVUS_HOST: milvus
      MILVUS_PORT: "19530"
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?set graph password}
      SILICONFLOW_API_KEY: ${SILICONFLOW_API_KEY:?set model provider key}
      MODEL: ${MODEL:-deepseek-ai/DeepSeek-V3.2}
      BASE_URL: https://api.siliconflow.cn/v1
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-Qwen/Qwen3-Embedding-4B}
      EMBEDDING_BASE_URL: https://api.siliconflow.cn/v1
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1536}
      PYTHONUNBUFFERED: "1"
    networks: [default, data]
    depends_on:
      mysql: {condition: service_healthy}
      redis: {condition: service_healthy}
      milvus: {condition: service_healthy}
    logging: *logging
networks:
  data: {internal: true}
volumes:
  mysql_data:
  redis_data:
  milvus_data:
  neo4j_data:
  caddy_data:
  caddy_config:
