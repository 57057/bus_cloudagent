server.address=127.0.0.1
server.port=${BUSINESS_PORT:5000}
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3307}/${MYSQL_DATABASE:cloud_platform}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC&useSSL=false
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:}
spring.datasource.hikari.initialization-fail-timeout=-1
spring.mvc.async.request-timeout=240000
agent.base-url=${AGENT_BASE_URL:http://127.0.0.1:5001}
service.token=${BUSINESS_SERVICE_TOKEN:}
mybatis-plus.configuration.map-underscore-to-camel-case=false
spring.jackson.time-zone=UTC
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB
platform.demo=${PLATFORM_DEMO:false}
platform.admin-user=${PLATFORM_ADMIN_USER:}
platform.admin-password=${PLATFORM_ADMIN_PASSWORD:}
platform.secure-cookie=${PLATFORM_SECURE_COOKIE:false}
platform.shared-demo=${PLATFORM_SHARED_DEMO:false}
platform.allowed-origins=${PLATFORM_ALLOWED_ORIGINS:http://127.0.0.1:5173,http://localhost:5173,http://127.0.0.1:5174,http://localhost:5174}
platform.jobs-enabled=${PLATFORM_JOBS_ENABLED:true}
platform.payment-minutes=${PLATFORM_PAYMENT_MINUTES:15}
platform.quote-minutes=${PLATFORM_QUOTE_MINUTES:10}
# Java 商品展示缓存；与 Python 记忆/语义缓存使用不同键空间。
spring.data.redis.host=${REDIS_HOST:127.0.0.1}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.username=${REDIS_USERNAME:}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${REDIS_SSL:false}
spring.data.redis.database=${BUSINESS_REDIS_DATABASE:0}
spring.data.redis.connect-timeout=300ms
spring.data.redis.timeout=300ms
spring.data.redis.repositories.enabled=false
platform.catalog-cache-enabled=${CATALOG_CACHE_ENABLED:true}
platform.catalog-cache-ttl-seconds=${CATALOG_CACHE_TTL_SECONDS:60}
platform.catalog-cache-prefix=${CATALOG_CACHE_PREFIX:cloudagent:business:catalog:v1:}
# 支付宝SDK的原始报文日志可能含订单明细；使用业务层脱敏状态，不输出SDK报文。
logging.level.sdk=OFF
# 本地应用密钥的主密钥文件；应独立受控备份，生产改用外部KMS。
platform.application-key-file=${APPLICATION_KEY_FILE:runtime/application-secret.key}
